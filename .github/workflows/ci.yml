name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore IndustrialVisualAnomalyDetection.slnx

      - name: Build solution
        run: dotnet build IndustrialVisualAnomalyDetection.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test IndustrialVisualAnomalyDetection.slnx --configuration Release --no-build
